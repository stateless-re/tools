[project]
name = "stateless-tools"
version = "0.1.0"
description = "Static config extractors and helpers for malware analysis"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pefile>=2023.2.7",
    "cryptography>=41",
    "dissect.util>=3.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
